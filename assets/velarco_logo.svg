<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="vg" x1="0" y1="256" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0fb8a8"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0e1b22"/>
  <!-- Power-duration curve: a rising arc that becomes the wheel -->
  <path d="M40 200 C 80 200, 92 150, 128 132 C 168 112, 176 70, 216 56"
        fill="none" stroke="url(#vg)" stroke-width="14" stroke-linecap="round"/>
  <!-- Wheel hub -->
  <circle cx="128" cy="132" r="10" fill="url(#vg)"/>
  <!-- Spokes hint (chain/kinetic link) -->
  <g stroke="url(#vg)" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="128" y1="132" x2="128" y2="92"/>
    <line x1="128" y1="132" x2="166" y2="150"/>
    <line x1="128" y1="132" x2="96" y2="150"/>
  </g>
  <!-- Wordmark -->
  <text x="128" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="26" font-weight="700" fill="#eaf6f4" letter-spacing="2">VELARCO</text>
</svg>
