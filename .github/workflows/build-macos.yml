name: Build macOS PCC.app + PCC.dmg

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the artifact to (e.g. v5.3.0)"
        required: false
        default: "v5.3.0"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout (branch pro)
        uses: actions/checkout@v4
        with:
          ref: pro

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller

      - name: Build PCC.app + PCC.dmg
        run: bash build_mac.sh

      - name: Zip PCC.app (alternative to DMG, no Gatekeeper block on extract)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/PCC.app PCC-macos.zip
          echo "Created PCC-macos.zip"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Attaching Mac artifacts to release $TAG"
          gh release upload "$TAG" "PCC.dmg" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "PCC-macos.zip" --repo "$GITHUB_REPOSITORY" --clobber
